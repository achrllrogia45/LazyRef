[package]
name = "purcore"
description = "Read and write PureRef 2.x `.pur` scene files: container codec, blob codecs, SQLite store, byte-identical writer."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
md-5 = "0.11"

[dev-dependencies]
# same version/features as the regular dep — tests exercise storage classes directly
rusqlite = { version = "0.40", features = ["bundled"] }
